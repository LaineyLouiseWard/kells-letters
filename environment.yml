# kells-letters environment (Linux, CUDA 13), exported from the conda env of that name on 3 Nov 2026 with
# `conda env export --no-builds`; built by cloning voynich-letters' env.
# - party is installed from https://github.com/mittagessen/party at commit c2589b1b515ed690f883c6afaef6c01ce29bf72d
#   with `pip install --no-deps`: it asks for kraken~=7.0.0b5 but runs with kraken 7.1.1, which this project pins;
#   its other needs (timm, pillow-jxl-plugin, python-bidi) are listed below. Creating the env from this file alone
#   would let pip downgrade kraken, so install party as sonic/setup_env.sh does.
# - Base models (CATMuS Medieval 1.5.0 and 1.6.0, PP-OCRv6 medium, party's base): Zenodo records, files and md5 in
#   config/models.yaml; `make models` downloads and tests them. Kraken's segmenter blla.mlmodel, inside the kraken
#   package: sha256 in config/paths.yaml.
